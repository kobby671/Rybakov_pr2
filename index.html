
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог учебных товаров</title>
</head>

<body>

    <header>
        <h1>Каталог учебных товаров</h1>
        <p>Практическая работа №2</p>
    </header>

    <main>
        <div class="page-layout">

            <aside class="filters">
                <h2>Фильтры</h2>

                <label for="categoryFilter">Категория:</label>
                <select id="categoryFilter">
                    <option value="all">Все категории</option>
                </select>
            </aside>

            <section class="catalog-section">
                <h2>Товары</h2>

                <div class="catalog" id="catalog">
                    <p>Здесь появятся карточки товаров</p>
                </div>
            </section>

        </div>

        <section class="info">
            <h2>О каталоге</h2>
            <p>Каталог использует данные из catalog.csv.</p>
        </section>
    </main>

    <footer>
        <p>Практическая работа №2 — HTML, CSS, SCSS</p>
    </footer>

</body>
</html>
